plugins {
    id "java"
    id "org.springframework.boot" version "3.5.16"
    id "io.spring.dependency-management" version "1.1.7"
}

group = "com.lyrashop"
version = "0.0.1-SNAPSHOT"
description = "REST API for the LyraShop e-commerce platform"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-mysql"
    runtimeOnly "com.mysql:mysql-connector-j"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:mysql"
}

def dockerReachable() {
    try {
        def process = new ProcessBuilder("docker", "info")
            .redirectOutput(ProcessBuilder.Redirect.DISCARD)
            .redirectError(ProcessBuilder.Redirect.DISCARD)
            .start()
        if (!process.waitFor(8, java.util.concurrent.TimeUnit.SECONDS)) {
            process.destroyForcibly()
            return false
        }
        return process.exitValue() == 0
    } catch (Exception ignored) {
        return false
    }
}

def skipDockerTests = project.hasProperty("skipDockerTests") ||
        (System.getenv("CI") != "true" && !dockerReachable())

if (skipDockerTests) {
    logger.lifecycle(
            "Skipping Testcontainers tests (LyraShopApplicationTests, NginxRegistrationIngressTests). " +
                    "CI always runs them; force a skip with -PskipDockerTests."
    )
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (skipDockerTests) {
        exclude "**/LyraShopApplicationTests.class"
        exclude "**/NginxRegistrationIngressTests.class"
    }
}

tasks.named("bootJar") {
    archiveFileName = "app.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("wrapper") {
    gradleVersion = "9.1.0"
    distributionType = Wrapper.DistributionType.BIN
    networkTimeout = 120000
}

tasks.named("bootRun") {
    def envFile = file(".env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
                def (key, value) = trimmed.split("=", 2)
                key = key.trim()
                value = value.trim()
                if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                environment key, value
            }
        }
    }
}
