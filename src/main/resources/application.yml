spring:
  application:
    name: lyrashop-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    auth:
      max-request-body-bytes: ${AUTH_MAX_REQUEST_BODY_BYTES:8192}
      max-concurrent-password-hashes: ${AUTH_MAX_CONCURRENT_PASSWORD_HASHES:2}
      retry-after-seconds: ${AUTH_RETRY_AFTER_SECONDS:1}
    jwt:
      issuer: ${JWT_ISSUER:https://api.lyrashop.local}
      audience: ${JWT_AUDIENCE:lyrashop-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      secret-base64: ${JWT_SECRET_BASE64:}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:7d}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
