spring:
  application:
    name: lyrashop-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_BYTES:2097152}
      max-request-size: ${UPLOAD_MAX_BYTES:2097152}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  uploads:
    directory: ${UPLOAD_DIR:${java.io.tmpdir}/lyrashop-uploads}
    max-bytes: ${UPLOAD_MAX_BYTES:2097152}
    cleanup-delay: ${UPLOAD_CLEANUP_DELAY:10m}
    cleanup-initial-delay: ${UPLOAD_CLEANUP_INITIAL_DELAY:1m}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:}
    ipn-url: ${VNPAY_IPN_URL:}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrator}
  security:
    email-verification:
      frontend-url: ${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:5173/auth}
      from-address: ${EMAIL_VERIFICATION_FROM:no-reply@lyrashop.local}
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
      request-cooldown: ${EMAIL_VERIFICATION_REQUEST_COOLDOWN:2m}
    password-reset:
      frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/auth}
      from-address: ${PASSWORD_RESET_FROM:no-reply@lyrashop.local}
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
      request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:2m}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    auth:
      max-request-body-bytes: ${AUTH_MAX_REQUEST_BODY_BYTES:8192}
      business-request-body-bytes: ${BUSINESS_MAX_REQUEST_BODY_BYTES:8192}
      max-concurrent-password-hashes: ${AUTH_MAX_CONCURRENT_PASSWORD_HASHES:2}
      retry-after-seconds: ${AUTH_RETRY_AFTER_SECONDS:1}
    jwt:
      issuer: ${JWT_ISSUER:https://api.lyrashop.local}
      audience: ${JWT_AUDIENCE:lyrashop-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      secret-base64: ${JWT_SECRET_BASE64:}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:7d}
  newsletter:
    frontend-url: ${NEWSLETTER_FRONTEND_URL:http://localhost:5173/}
    from-address: ${NEWSLETTER_FROM:no-reply@lyrashop.local}
    confirmation-ttl: ${NEWSLETTER_CONFIRMATION_TTL:24h}
  order:
    online-payment-ttl: ${ORDER_ONLINE_PAYMENT_TTL:30m}
    confirmation-ttl: ${ORDER_CONFIRMATION_TTL:24h}
    expiration-sweep-delay: ${ORDER_EXPIRATION_SWEEP_DELAY:1m}
    expiration-sweep-initial-delay: ${ORDER_EXPIRATION_SWEEP_INITIAL_DELAY:30s}
  mail-outbox:
    sweep-delay: ${MAIL_OUTBOX_SWEEP_DELAY:30s}
    initial-delay: ${MAIL_OUTBOX_INITIAL_DELAY:5s}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
